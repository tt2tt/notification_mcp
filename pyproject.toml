# ビルドバックエンドの指定(hatchlingを使用してパッケージをビルドする)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# プロジェクトのメタデータ(パッケージ名・バージョン・依存関係)
[project]
name = "notification-mcp"
version = "0.1.0"
description = "Discord通知用MCPサーバー"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",           # MCP公式Python SDK
    "httpx==0.28.1",        # Discord Webhookへの非同期HTTPリクエスト用
    "python-dotenv==1.2.3", # .envファイルからの環境変数読み込み用
    "pydantic==2.13.5",     # 設定値・入力値のバリデーション用
]

# コンソールスクリプトの定義(pip install -e . 後に notification-mcp コマンドで起動できる)
[project.scripts]
notification-mcp = "notification_mcp.server:main"

# 開発時のみ必要な依存関係(pip install -e ".[dev]" でインストールする)
[project.optional-dependencies]
dev = [
    "ruff==0.16.8",   # Lint・フォーマット用
    "mcp[cli]==2.2.0", # `mcp dev`によるMCP Inspectorでの手動動作確認用
]

# hatchlingのビルド対象パッケージ(srcレイアウト)を指定
[tool.hatch.build.targets.wheel]
packages = ["src/notification_mcp"]

# ruffのLint・フォーマット設定(PEP8準拠のため行長は標準の88文字とする)
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"] # pycodestyle, pyflakes, isort相当のルールを有効化
